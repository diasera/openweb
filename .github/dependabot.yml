version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Jakarta
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(deps)
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      next-react-major:
        patterns:
          - "next"
          - "eslint-config-next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types: ["major"]
    ignore:
      # Sengaja ditahan; alasannya ada di docs/ARCHITECTURE.md → "Catatan versi dependensi".
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Jakarta
    open-pull-requests-limit: 1
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
