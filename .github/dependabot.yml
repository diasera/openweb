version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      next-react:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react", "@types/react-dom"]
      tiptap:
        patterns: ["@tiptap/*"]
      supabase:
        patterns: ["@supabase/*"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
    ignore:
      # Sengaja ditahan; alasannya ada di README → "Versi yang sengaja ditahan".
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Jakarta
    commit-message:
      prefix: ci
